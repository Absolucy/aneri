[package]
name = "aneri-sql"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aneri-core = { path = "../core", features = ["runtime"] }
meowtonin = { workspace = true }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
mysql_common = { version = "0.37", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1", features = ["sync", "time"] }

[features]
default = ["tls"]
tls = ["dep:rustls", "mysql_async/rustls-tls", "mysql_async/tls12", "mysql_async/ring"]
